# ============================================================================
# Prompts do experimento.
#
# O registro tem DOIS, e o estudo não tem eixo de especificidade de prompt: a
# comparação é entre sistemas, com a instrução fixa.
#
#   p0  não é um prompt: é o marcador de "este sistema não recebe instrução em
#       linguagem natural". Serve aos sistemas de OCR/layout (MinerU). Modelos
#       instruídos NUNCA são executados sob ele, e ele nunca é executado sob
#       modelos instruídos — a regra está em `runner.prompts_do_modelo`.
#
#   p1  o prompt do estudo, e o único instruído.
#
# O cabeçalho antigo descrevia uma escala p1/p2/p3 de especificidade crescente,
# mais uma ablação p4. Nada disso existe neste arquivo, e o README já registra
# que não há esse eixo. Acrescentar um prompt aqui não é de graça: cada um
# dispara uma rodada paga a mais em todos os modelos de API.
# ============================================================================

- id: p0
  enabled: true
  prompt_agnostic: true
  label: "Sem prompt (OCR estrutural)"
  description: >-
    Sistemas que analisam o documento sem receber instrução. O eixo de prompt
    não se aplica; a comparação com os LLMs se faz modelo a modelo, não
    prompt a prompt.
  text: "(não se aplica: o sistema não recebe instrução em linguagem natural)"

- id: p1
  enabled: true
  label: "Sem formato"
  description: "Não especifica formato de saída. Mede o comportamento default do modelo."
  text: "Sabendo que essa imagem é um documento antigo brasileiro podendo estar entre 1890 e 1950, transforme essa imagem em um documento HTML respeitando o layout e palavras originais, retorne apenas o código HTML sem texto extra."

